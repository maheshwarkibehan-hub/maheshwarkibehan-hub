<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B0F1D"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="sysBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Top Accent Line -->
    <linearGradient id="sysHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="25%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <style>
      .sf-font {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }
      .pulse-item {
        animation: pulseGlow 2.5s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Card Body -->
  <rect x="1" y="1" width="938" height="178" rx="20" fill="url(#sysBg)" stroke="url(#sysBorder)" stroke-width="1.5"/>
  <path d="M 30 1 L 910 1" stroke="url(#sysHighlight)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center Vertical Column Divider -->
  <line x1="470" y1="20" x2="470" y2="160" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= LEFT COLUMN: ZenFocus & Desktop Systems ================= -->
  <g transform="translate(32, 22)">
    <!-- Column Header Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="22" rx="6" fill="#1E1B4B" fill-opacity="0.6" stroke="#4338CA" stroke-width="0.8"/>
      <circle cx="10" cy="11" r="3" fill="#818CF8" class="pulse-item"/>
      <text x="18" y="15" fill="#C7D2FE" font-size="9.5" font-weight="700" class="sf-font" letter-spacing="0.5">SYSTEMS &amp; FOCUS ENGINES</text>
    </g>

    <!-- Title & Desc -->
    <text x="0" y="44" fill="#F8FAFC" font-size="16" font-weight="700" class="sf-font" letter-spacing="-0.3">ZenFocus &amp; Hacker Terminal</text>
    <text x="0" y="64" fill="#94A3B8" font-size="11.5" font-weight="400" class="sf-font">Android accessibility detox interceptor to eliminate doom-scrolling routines,</text>
    <text x="0" y="80" fill="#94A3B8" font-size="11.5" font-weight="400" class="sf-font">coupled with high-fidelity cyberpunk desktop workstation emulators.</text>

    <!-- Left Badges -->
    <g transform="translate(0, 98)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="70" height="22" rx="5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
        <text x="35" y="15" text-anchor="middle" fill="#CBD5E1" font-size="9.5" font-weight="500" class="sf-font">Kotlin</text>
      </g>
      <g transform="translate(76, 0)">
        <rect x="0" y="0" width="124" height="22" rx="5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
        <text x="62" y="15" text-anchor="middle" fill="#CBD5E1" font-size="9.5" font-weight="500" class="sf-font">Accessibility Services</text>
      </g>
      <g transform="translate(206, 0)">
        <rect x="0" y="0" width="80" height="22" rx="5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
        <text x="40" y="15" text-anchor="middle" fill="#CBD5E1" font-size="9.5" font-weight="500" class="sf-font">Electron</text>
      </g>
      <g transform="translate(292, 0)">
        <rect x="0" y="0" width="80" height="22" rx="5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
        <text x="40" y="15" text-anchor="middle" fill="#CBD5E1" font-size="9.5" font-weight="500" class="sf-font">xterm.js</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: Embedded Hardware & Robotics ================= -->
  <g transform="translate(502, 22)">
    <!-- Column Header Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="186" height="22" rx="6" fill="#14532D" fill-opacity="0.5" stroke="#15803D" stroke-width="0.8"/>
      <circle cx="10" cy="11" r="3" fill="#34D399" class="pulse-item"/>
      <text x="18" y="15" fill="#86EFAC" font-size="9.5" font-weight="700" class="sf-font" letter-spacing="0.5">EMBEDDED SYSTEMS &amp; ROBOTICS</text>
    </g>

    <!-- Title & Desc -->
    <text x="0" y="44" fill="#F8FAFC" font-size="16" font-weight="700" class="sf-font" letter-spacing="-0.3">Robotic Hand &amp; Sensor Telemetry</text>
    <text x="0" y="64" fill="#94A3B8" font-size="11.5" font-weight="400" class="sf-font">Autonomous articulated multi-axis servo hand with PWM micro-timing,</text>
    <text x="0" y="80" fill="#94A3B8" font-size="11.5" font-weight="400" class="sf-font">synchronized ultrasonic spatial ranging arrays, and bare-metal firmware.</text>

    <!-- Right Badges -->
    <g transform="translate(0, 98)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="56" height="22" rx="5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
        <text x="28" y="15" text-anchor="middle" fill="#CBD5E1" font-size="9.5" font-weight="500" class="sf-font">C++</text>
      </g>
      <g transform="translate(62, 0)">
        <rect x="0" y="0" width="76" height="22" rx="5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
        <text x="38" y="15" text-anchor="middle" fill="#CBD5E1" font-size="9.5" font-weight="500" class="sf-font">Arduino</text>
      </g>
      <g transform="translate(144, 0)">
        <rect x="0" y="0" width="112" height="22" rx="5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
        <text x="56" y="15" text-anchor="middle" fill="#CBD5E1" font-size="9.5" font-weight="500" class="sf-font">Servo PWM Control</text>
      </g>
      <g transform="translate(262, 0)">
        <rect x="0" y="0" width="118" height="22" rx="5" fill="#111827" stroke="#1E293B" stroke-width="0.8"/>
        <text x="59" y="15" text-anchor="middle" fill="#CBD5E1" font-size="9.5" font-weight="500" class="sf-font">Ultrasonic Ranging</text>
      </g>
    </g>
  </g>
</svg>
